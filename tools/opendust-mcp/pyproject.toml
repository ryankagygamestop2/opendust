[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendust-mcp"
version = "0.1.0"
description = "stdio MCP bridge from Claude Code (or any MCP client) to a running OpenDust engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0",
    "websockets>=12",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
opendust-mcp = "opendust_mcp:main"

[tool.setuptools]
py-modules = ["opendust_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
